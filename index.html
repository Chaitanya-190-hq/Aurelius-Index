<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelius Index</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0f;
  color: #e0e0e0;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== ANIMATED GRADIENT BACKGROUND ===== */
.bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1;
  background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a1a2e, #0a0a1a);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== AMBIENT PARTICLES (canvas) ===== */
#particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none; opacity: 0.55;
}

/* ===== FILM GRAIN OVERLAY ===== */
#grain {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 2; pointer-events: none; opacity: 0.045;
  mix-blend-mode: overlay;
}

/* ===== VIGNETTE ===== */
#vignette {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(5,5,15,0.65) 100%);
}

/* subtle gold glow orbs */
.glow-orb {
  position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
}
.glow-orb.g1 { width: 600px; height: 600px; top: -200px; right: -150px; background: radial-gradient(circle, rgba(201,168,76,0.10), transparent 70%); animation: driftr 24s ease-in-out infinite alternate; }
.glow-orb.g2 { width: 500px; height: 500px; bottom: -150px; left: -120px; background: radial-gradient(circle, rgba(120,140,200,0.10), transparent 70%); animation: driftl 28s ease-in-out infinite alternate; }
.glow-orb.g3 { width: 400px; height: 400px; top: 40%; left: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(201,168,76,0.06), transparent 70%); animation: driftc 32s ease-in-out infinite alternate; }
@keyframes driftr { 0% { transform: translate(0,0); } 100% { transform: translate(-60px,40px); } }
@keyframes driftl { 0% { transform: translate(0,0); } 100% { transform: translate(50px,-30px); } }
@keyframes driftc { 0% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; } 100% { transform: translate(-50%,-50%) scale(1.4); opacity: 0.9; } }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 3px; }

/* ===== GLASSMORPHISM CARD ===== */
.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);  border-radius: 20px; padding: 40px;
  max-width: 480px;
  width: 90%;
  margin: 0 auto;
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
/* ===== CENTER CONTAINER ===== */
.center-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}

/* landing page entrance */
#landingPage {
  animation: landIn 0.9s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes landIn {
  0% { opacity: 0; transform: translateY(18px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ===== LANDING PAGE ===== */
.landing-title {
  font-family: 'Playfair Display', 'Times New Roman', serif;
  font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 300; letter-spacing: 6px;
  text-align: center; color: #e8c67a; margin-bottom: 6px;
  text-shadow: 0 0 40px rgba(201,168,76,0.18);
}
.landing-sub {
  text-align: center; color: #9a8a6a; font-size: 0.72rem;
  letter-spacing: 5px; margin-bottom: 34px; text-transform: uppercase;
}
.landing-seal {
  display: flex; justify-content: center; margin-bottom: 18px;
  filter: drop-shadow(0 0 18px rgba(201,168,76,0.25));
  animation: sealGlow 4s ease-in-out infinite alternate;
}
@keyframes sealGlow {
  0% { filter: drop-shadow(0 0 12px rgba(201,168,76,0.18)); }
  100% { filter: drop-shadow(0 0 26px rgba(201,168,76,0.38)); }
}
.landing-hint {
  text-align: center; color: #666; font-size: 0.72rem;
  letter-spacing: 0.5px; margin-top: 14px; margin-bottom: 4px;
}
.hash-hint {
  color: #c9a84c; font-family: 'Inter', monospace;
  letter-spacing: 1px; border-bottom: 1px dotted rgba(201,168,76,0.4);
  cursor: help;
}
.code-input {
  width: 100%; padding: 16px 18px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: 14px; color: #fff; font-size: 1.05rem;
  letter-spacing: 4px; text-align: center;
  outline: none; transition: border 0.3s, box-shadow 0.3s, background 0.3s;
  text-transform: uppercase; font-family: 'Inter', monospace;
}
.code-input:focus {
  border-color: #c9a84c; background: rgba(201,168,76,0.06);
  box-shadow: 0 0 0 4px rgba(201,168,76,0.06), 0 0 30px rgba(201,168,76,0.05);
}
.code-input::placeholder { letter-spacing: 1px; text-transform: none; color: #555; }
.btn {
  width: 100%; padding: 15px; margin-top: 14px;
  background: linear-gradient(135deg, #d4b06a, #b8922e, #c9a84c);
  border: none; border-radius: 12px; color: #0a0a0f;
  font-size: 0.95rem; font-weight: 600; letter-spacing: 3px;
  cursor: pointer; transition: transform 0.25s, opacity 0.2s, box-shadow 0.25s;
  text-shadow: 0 1px 0 rgba(255,255,255,0.18);
  position: relative; overflow: hidden;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.25), transparent 50%);
  opacity: 0; transition: opacity 0.3s;
}
.btn:hover { transform: translateY(-2px); opacity: 0.95; box-shadow: 0 8px 24px rgba(201,168,76,0.25); }
.btn:hover::after { opacity: 1; }
.btn:active { transform: translateY(0); }
.btn-secondary {
  background: rgba(255,255,255,0.05);
  color: #c9a84c; border: 1px solid rgba(201,168,76,0.28);
  margin-top: 10px; letter-spacing: 1px; font-size: 0.82rem;
}
.error-msg {
  color: #ff8a8a; font-size: 0.82rem; text-align: center;
  margin-top: 14px; min-height: 20px; letter-spacing: 0.5px;
}

/* ===== VALIDATION OVERLAY ===== */
.validation-overlay {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; z-index: 100;
  background: rgba(10,10,15,0.92);
  align-items: center; justify-content: center; flex-direction: column;
}
.validation-overlay.active { display: flex; }
.spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(201,168,76,0.15);
  border-top: 3px solid #c9a84c;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.val-text {
  margin-top: 20px; font-size: 1.1rem; letter-spacing: 2px;
  color: #c9a84c; animation: pulse 1.5s ease infinite;
}
.val-sub {
  margin-top: 8px; font-size: 0.85rem; color: #666;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.val-steps { margin-top: 24px; }
.val-step {
  color: #555; font-size: 0.8rem; letter-spacing: 1px;
  margin: 6px 0; transition: color 0.5s;
}
.val-step.done { color: #4caf50; }
.val-step.active { color: #c9a84c; }

/* ===== RESOURCE VIEWER ===== */
.resource-viewer {
  display: none; max-width: 720px; width: 90%; margin: 50px auto;
}
.resource-viewer.active { display: block; }
.back-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 22px; padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.back-btn {
  background: none; border: none; color: #c9a84c; cursor: pointer;
  font-size: 0.78rem; letter-spacing: 2px; padding: 6px 4px;
  text-transform: uppercase; font-weight: 500;
  transition: color 0.2s, opacity 0.2s;
}
.back-btn:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }
.code-badge {
  font-family: 'Inter', monospace; font-size: 0.7rem; color: #9a8a6a;
  letter-spacing: 2px; padding: 5px 14px; border: 1px solid rgba(201,168,76,0.2);
  border-radius: 20px; background: rgba(201,168,76,0.05);
}
.resource-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 22px; padding: 40px;
  position: relative; overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.resource-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(201,168,76,0.5), rgba(201,168,76,0.85), rgba(201,168,76,0.5), transparent);
  opacity: 0; transition: opacity 0.5s;
}
.resource-card:hover::before { opacity: 1; }
.resource-card:hover {
  border-color: rgba(201,168,76,0.22);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(201,168,76,0.08);
}

/* resource type badges — refined */
.resource-type-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.68rem; letter-spacing: 2.5px; text-transform: uppercase;
  padding: 5px 13px; border-radius: 20px; margin-bottom: 18px;
  border: 1px solid transparent; font-weight: 500;
}
.type-link { background: rgba(201,168,76,0.10); color: #d4b06a; border-color: rgba(201,168,76,0.22); }
.type-note { background: rgba(120,150,210,0.10); color: #b8c8e8; border-color: rgba(120,150,210,0.22); }
.resource-type-badge::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: 0.8;
}

/* title — serif for aura */
.resource-title {
  font-family: 'Playfair Display', 'Times New Roman', serif;
  font-size: clamp(1.7rem, 4vw, 2.2rem); font-weight: 400;
  color: #f0e6d2; margin-bottom: 10px; line-height: 1.2;
  letter-spacing: 0.3px;
}

/* link URL — 'source' treatment */
.resource-url {
  display: inline-block; color: #c9a84c; font-size: 0.82rem;
  word-break: break-all; letter-spacing: 0.4px;
  border-bottom: 1px solid rgba(201,168,76,0.25);
  padding-bottom: 2px; transition: border-color 0.2s, color 0.2s;
}
.resource-url:hover { border-color: #c9a84c; color: #e8c67a; }
.resource-source-label {
  display: inline-block; font-size: 0.62rem; letter-spacing: 2px;
  text-transform: uppercase; color: #666; margin-bottom: 4px;
}

/* description */
.resource-desc { color: #b8b2a4; line-height: 1.7; margin: 14px 0 16px; font-size: 0.95rem; }

/* notes — manuscript panel */
.resource-notes {
  background: rgba(255,255,255,0.025);
  border-left: 2px solid rgba(201,168,76,0.35);
  padding: 16px 20px; border-radius: 0 12px 12px 0;
  font-size: 0.92rem; line-height: 1.7; color: #c4bda8;
  white-space: pre-wrap; font-style: italic;
}

/* note content — manuscript body */
.resource-content {
  line-height: 1.85; font-size: 1.02rem; color: #d8d0c0;
  white-space: pre-wrap;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
}

/* meta — museum plaque */
.resource-meta {
  margin-top: 24px; padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 0.7rem; color: #555; letter-spacing: 1.5px;
  display: flex; gap: 22px; flex-wrap: wrap;
  text-transform: uppercase;
}
.resource-meta span { display: inline-flex; align-items: center; gap: 6px; }
.resource-meta .meta-mark {
  font-size: 0.6rem; color: #c9a84c; opacity: 0.7;
}

.open-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 30px; margin-top: 18px;
  background: linear-gradient(135deg, #d4b06a, #b8922e);
  border: none; border-radius: 12px; color: #0a0a0f;
  font-size: 0.9rem; font-weight: 600; letter-spacing: 1.5px;
  text-decoration: none; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s;
  text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  position: relative; overflow: hidden;
}
.open-btn::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.22), transparent 55%);
  opacity: 0; transition: opacity 0.3s;
}
.open-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(201,168,76,0.3); }
.open-btn:hover::after { opacity: 1; }
.open-btn:active { transform: translateY(0); }
.open-btn .arrow { transition: transform 0.25s; }
.open-btn:hover .arrow { transform: translateX(3px); }

/* ===== QR CODES ===== */
.qr-tab-bar {
  display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap;
}
.qr-tab {
  padding: 6px 14px; font-size: 0.75rem; letter-spacing: 1px;
  border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.03); color: #888;
  cursor: pointer; transition: all 0.2s;
}
.qr-tab.active {
  background: rgba(201,168,76,0.15); color: #c9a84c; border-color: rgba(201,168,76,0.4);
}
.qr-tab:hover { border-color: rgba(201,168,76,0.4); }
.qr-panel { display: none; }
.qr-panel.active { display: block; }
.qr-wrap {
  display: flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.05);
  border-radius: 16px; padding: 22px 18px; margin-bottom: 14px;
  transition: border-color 0.25s;
}
.qr-wrap:hover { border-color: rgba(201,168,76,0.2); }
.qr-wrap canvas, .qr-wrap img { max-width: 170px; height: auto; }
.qr-label {
  margin-top: 10px; font-size: 0.78rem; color: #c4bda8; letter-spacing: 0.5px;
  word-break: break-all; text-align: center; line-height: 1.4;
}
.qr-label .qr-code-tag {
  display: block; font-family: 'Inter', monospace; font-size: 0.66rem;
  color: #9a8a6a; letter-spacing: 1.5px; margin-bottom: 3px;
}
.qr-url-editable {
  margin-top: 9px; width: 100%; max-width: 380px;
  padding: 7px 10px; background: rgba(201,168,76,0.04);
  border: 1px solid rgba(201,168,76,0.18); border-radius: 8px;
  color: #d4b06a; font-size: 0.68rem; letter-spacing: 0.4px;
  text-align: center; outline: none; font-family: 'Inter', monospace;
  transition: border-color 0.25s, box-shadow 0.25s;
}
.qr-url-editable:focus { border-color: rgba(201,168,76,0.5); box-shadow: 0 0 0 3px rgba(201,168,76,0.06); }
.qr-url-editable:focus { border-color: #c9a84c; }
.qr-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px; margin-top: 12px;
}
.no-qr-hint {
  color: #555; font-size: 0.8rem; text-align: center; padding: 16px;
}

/* ===== ADMIN DASHBOARD ===== */
.admin-viewer {
  display: none; max-width: 880px; width: 95%; margin: 40px auto;
}
.admin-viewer.active { display: block; }
.admin-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; margin-bottom: 26px;
  padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
}
.admin-title {
  font-family: 'Playfair Display', 'Times New Roman', serif;
  font-size: 1.9rem; font-weight: 400; color: #e8c67a; letter-spacing: 1px;
}
.admin-title .gear { color: #c9a84c; opacity: 0.8; margin-right: 8px; }
.admin-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
  gap: 12px; margin-bottom: 26px;
}
.stat-card {
  background: rgba(255,255,255,0.03); padding: 18px 14px; border-radius: 14px;
  text-align: center; border: 1px solid rgba(255,255,255,0.05);
  transition: border-color 0.25s, box-shadow 0.25s;
}
.stat-card:hover { border-color: rgba(201,168,76,0.2); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.stat-num {
  font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 400;
  color: #e8c67a; line-height: 1;
}
.stat-label {
  font-size: 0.66rem; color: #777; letter-spacing: 2px;
  margin-top: 6px; text-transform: uppercase;
}

.admin-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px;
}
.btn-sm {
  padding: 9px 16px; font-size: 0.78rem; border-radius: 9px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
  color: #d8d8d8; cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
  font-weight: 500;
}
.btn-sm:hover { border-color: rgba(201,168,76,0.4); color: #e8c67a; background: rgba(201,168,76,0.06); }
.btn-sm.danger { border-color: rgba(255,107,107,0.25); color: #ff8a8a; }
.btn-sm.danger:hover { border-color: #ff6b6b; color: #ff8a8a; background: rgba(255,107,107,0.06); }
.btn-sm.primary { background: rgba(201,168,76,0.10); border-color: rgba(201,168,76,0.28); color: #d4b06a; }
.btn-sm.primary:hover { background: rgba(201,168,76,0.16); border-color: rgba(201,168,76,0.45); }

/* ===== RESOURCE LIST (ADMIN) ===== */
.resource-list { margin-top: 6px; }
.admin-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; background: rgba(255,255,255,0.025);
  border-radius: 13px; margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.04);
  transition: border-color 0.2s, background 0.2s;
}
.admin-item:hover { border-color: rgba(201,168,76,0.18); background: rgba(201,168,76,0.03); }
.admin-item-code {
  font-family: 'Inter', monospace; font-size: 0.66rem; color: #7a7158;
  letter-spacing: 1px; width: 128px; flex-shrink: 0;
  border-right: 1px solid rgba(255,255,255,0.05); padding-right: 12px;
}
.admin-item-title { flex: 1; margin: 0 6px; font-size: 0.9rem; color: #e0d8c6; }
.admin-item-type {
  font-size: 0.62rem; padding: 3px 9px; border-radius: 12px;
  letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
}
.admin-item-type.type-link { background: rgba(201,168,76,0.10); color: #d4b06a; }
.admin-item-type.type-note { background: rgba(120,150,210,0.10); color: #b8c8e8; }
.admin-item-actions { display: flex; gap: 2px; }
.icon-btn {
  background: none; border: none; color: #666; cursor: pointer;
  padding: 6px 8px; font-size: 0.92rem; border-radius: 7px; transition: all 0.2s;
  line-height: 1;
}
.icon-btn:hover { color: #e8c67a; background: rgba(201,168,76,0.08); }
.icon-btn.danger:hover { color: #ff8a8a; background: rgba(255,107,107,0.08); }

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10,10,15,0.82); z-index: 50;
  align-items: center; justify-content: center; padding: 20px;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal-overlay.active { display: flex; animation: modalIn 0.25s ease both; }
@keyframes modalIn { 0% { opacity: 0; } 100% { opacity: 1; } }
.modal {
  background: #15151f; border-radius: 18px; padding: 34px;
  max-width: 540px; width: 100%; border: 1px solid rgba(255,255,255,0.07);
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: modalSlide 0.3s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes modalSlide {
  0% { opacity: 0; transform: translateY(16px) scale(0.98); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.modal h3 {
  font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 400;
  margin-bottom: 22px; color: #e8c67a; letter-spacing: 0.5px;
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 0.7rem; color: #888;
  margin-bottom: 5px; letter-spacing: 1.5px; text-transform: uppercase;
}
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 11px 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 9px; color: #f0e6d2; font-size: 0.9rem;
  outline: none; transition: border 0.3s, box-shadow 0.3s, background 0.3s;
  font-family: 'Inter', system-ui, sans-serif;
}
.form-group input::placeholder, .form-group textarea::placeholder { color: #555; }
.form-group textarea { min-height: 110px; resize: vertical; line-height: 1.6; }
.form-group input:focus, .form-group textarea:focus {
  border-color: rgba(201,168,76,0.5); background: rgba(201,168,76,0.04);
  box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
}
.form-group input[readonly] { opacity: 0.55; letter-spacing: 1px; }
.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.modal-actions .btn { margin-top: 0; flex: 1; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 34px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: rgba(21,21,31,0.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.08); color: #e8e0d0;
  padding: 11px 22px; border-radius: 12px;
  font-size: 0.82rem; letter-spacing: 0.4px; z-index: 200;
  opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
  pointer-events: none; box-shadow: 0 12px 36px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== RESPONSIVE ===== */
@media (max-width: 640px) {
  .glass { padding: 26px 22px; }
  .landing-title { letter-spacing: 4px; }
  .landing-seal { transform: scale(0.85); }
  .resource-card { padding: 26px 22px; border-radius: 18px; }
  .resource-title { font-size: 1.5rem; }
  .resource-meta { gap: 14px; }
  .admin-header { flex-direction: column; align-items: flex-start; }
  .admin-item { flex-wrap: wrap; gap: 8px; }
  .admin-item-code { width: 100%; border-right: none; padding-right: 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
  .modal { padding: 24px 20px; }
  .resource-viewer { margin: 30px auto; }
  .open-btn .arrow { display: none; }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="glow-orb g1"></div>
<div class="glow-orb g2"></div>
<div class="glow-orb g3"></div>
<canvas id="particles"></canvas>
<canvas id="grain"></canvas>
<div id="vignette"></div>

<!-- ===== VALIDATION OVERLAY ===== -->
<div class="validation-overlay" id="validationOverlay">
  <div class="spinner"></div>
  <div class="val-text" id="valText">Validating Access...</div>
  <div class="val-sub" id="valSub">Secure handshake in progress</div>
  <div class="val-steps" id="valSteps">
    <div class="val-step" data-step="0">⟐ Validating credentials</div>
    <div class="val-step" data-step="1">⟐ Decrypting resource</div>
    <div class="val-step" data-step="2">⟐ Loading content</div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ===== LANDING PAGE ===== -->
<div class="center-screen" id="landingPage">
  <div class="glass">
    <div class="landing-seal">
      <svg viewBox="0 0 120 120" width="74" height="74" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="56" stroke="#c9a84c" stroke-width="1.2" opacity="0.55"/>
        <circle cx="60" cy="60" r="46" stroke="#c9a84c" stroke-width="0.8" opacity="0.35" stroke-dasharray="2 4"/>
        <path d="M60 28 L60 92 M28 60 L92 60" stroke="#c9a84c" stroke-width="0.8" opacity="0.4"/>
        <circle cx="60" cy="60" r="11" fill="rgba(201,168,76,0.10)" stroke="#c9a84c" stroke-width="1"/>
        <text x="60" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#e8c67a" letter-spacing="1">A</text>
        <path d="M30 88 L90 88" stroke="#c9a84c" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
        <text x="60" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#9a8a6a" letter-spacing="3">AUR L EX</text>
      </svg>
    </div>
    <div class="landing-title">Aurelius Index</div>
    <div class="landing-sub">PRIVATE REFERENCE SYSTEM</div>
    <div class="landing-hint">enter a resource code &middot; or visit <span class="hash-hint">yoursite/#CODE</span></div>
    <input class="code-input" id="codeInput" placeholder="Enter Resource Code" maxlength="20" spellcheck="false" autocomplete="off">
    <button class="btn" onclick="submitCode()">ACCESS</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- ===== RESOURCE VIEWER ===== -->
<div class="resource-viewer" id="resourceViewer">
  <div class="back-bar">
    <button class="back-btn" onclick="goBack()">← BACK</button>
    <span class="code-badge" id="viewerCode"></span>
  </div>
  <div class="resource-card" id="resourceCard"></div>

  <!-- ===== QR TAB BAR ===== -->
  <div class="qr-tab-bar" id="qrTabBar">
    <button class="qr-tab active" data-qr-panel="details">Details</button>
    <button class="qr-tab" data-qr-panel="qr">QR Code</button>
  </div>

  <!-- ===== DETAILS PANEL ===== -->
  <div class="qr-panel active" id="qrPanelDetails"></div>

  <!-- ===== QR PANEL ===== -->
  <div class="qr-panel" id="qrPanelQr">
    <div id="qrContainer"></div>
    <div class="no-qr-hint" id="qrHint"></div>
  </div>
</div>

<!-- ===== ADMIN VIEWER ===== -->
<div class="admin-viewer" id="adminViewer">
  <div class="admin-header">
    <div class="admin-title">⚙ Aurelius Admin</div>
    <button class="back-btn" onclick="goBack()">← EXIT ADMIN</button>
  </div>

  <div class="admin-stats" id="adminStats"></div>

  <div class="admin-actions">
    <button class="btn-sm primary" onclick="openAddModal('link')">+ New Link</button>
    <button class="btn-sm primary" onclick="openAddModal('note')">+ New Note</button>
    <button class="btn-sm" onclick="exportDB()">⬇ Export</button>
    <button class="btn-sm" onclick="document.getElementById('importInput').click()">⬆ Import</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importDB(event)">
    <button class="btn-sm danger" onclick="if(confirm('Remove ALL data?')){clearAll()}">✕ Clear All</button>
    <button class="btn-sm primary" onclick="renderQRTab()">⊞ QR Codes</button>
  </div>

  <div class="resource-list" id="resourceList"></div>

  <!-- ===== QR GRID (ADMIN) ===== -->
  <div class="qr-grid" id="qrGrid" style="display:none"></div>
</div>

<script>
// ===== DATA =====
let db = { masterCode: '', resources: [] };
let currentView = 'landing'; // landing | resource | admin
let currentResource = null;

// ===== INIT =====
async function init() {
  try {
    const res = await fetch('db.json?' + Date.now());
    db = await res.json();
  } catch(e) {
    // Seed with defaults if db.json not found
    db = {
      "masterCode": "AUR-MSTR-KEY-001",
      "resources": [
        {
          "code": "REF-7X9Q-K2M4",
          "type": "link",
          "title": "Python Documentation",
          "url": "https://docs.python.org",
          "description": "Official Python documentation, tutorials, and guides.",
          "notes": "Great reference for standard library.",
          "createdAt": new Date().toISOString().split('T')[0],
          "modifiedAt": new Date().toISOString().split('T')[0]
        },
        {
          "code": "ARC-3M8P-W5L2",
          "type": "note",
          "title": "Welcome to Aurelius Index",
          "content": "This is a private reference system.\n\nEnter a resource code to view content.\nEnter the master code to access admin.",
          "createdAt": new Date().toISOString().split('T')[0],
          "modifiedAt": new Date().toISOString().split('T')[0]
        }
      ]
    };
  }

  // Check URL hash for direct access
  const hash = window.location.hash.replace('#', '').trim();
  if (hash) {
    document.getElementById('codeInput').value = hash;
    submitCode();
  }
}

// ===== CODE SUBMISSION =====
function submitCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  document.getElementById('errorMsg').textContent = '';

  if (!code) {
    document.getElementById('errorMsg').textContent = 'Enter a resource or master code.';
    return;
  }

  // Check master code
  if (code === db.masterCode) {
    showValidation(true);
    setTimeout(() => {
      hideValidation();
      showAdmin();
    }, 2000);
    return;
  }

  // Check resource code
  const resource = db.resources.find(r => r.code === code);
  if (resource) {
    showValidation(false);
    setTimeout(() => {
      hideValidation();
      showResource(resource);
    }, 2000);
    return;
  }

  document.getElementById('errorMsg').textContent = 'Invalid code. No resource found.';
}

// ===== VALIDATION ANIMATION =====
function showValidation(isMaster) {
  const overlay = document.getElementById('validationOverlay');
  const text = document.getElementById('valText');
  const sub = document.getElementById('valSub');
  const steps = document.querySelectorAll('.val-step');

  overlay.classList.add('active');
  steps.forEach(s => s.className = 'val-step');

  if (isMaster) {
    text.textContent = 'Authenticating Administrator...';
    sub.textContent = 'Master clearance verification';
  } else {
    text.textContent = 'Validating Access...';
    sub.textContent = 'Secure handshake in progress';
  }

  // Animate steps
  setTimeout(() => { steps[0].classList.add('active'); }, 300);
  setTimeout(() => { steps[0].classList.remove('active'); steps[0].classList.add('done'); steps[1].classList.add('active'); }, 900);
  setTimeout(() => { steps[1].classList.remove('active'); steps[1].classList.add('done'); steps[2].classList.add('active'); }, 1500);
  setTimeout(() => { steps[2].classList.remove('active'); steps[2].classList.add('done'); }, 2000);
}

function hideValidation() {
  document.getElementById('validationOverlay').classList.remove('active');
}

// ===== SHOW RESOURCE =====
function showResource(resource) {
  currentView = 'resource';
  currentResource = resource;
  hideAllViews();
  document.getElementById('resourceViewer').classList.add('active');
  document.getElementById('viewerCode').textContent = resource.code;

  const card = document.getElementById('resourceCard');

  if (resource.type === 'link') {
    card.innerHTML = `
      <span class="resource-type-badge type-link">⟐ LINK</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <div class="resource-source-label">Source</div>
      <a class="resource-url" href="${esc(resource.url)}" target="_blank" rel="noopener">${esc(resource.url)}</a>
      ${resource.description ? `<div class="resource-desc">${esc(resource.description)}</div>` : ''}
      ${resource.notes ? `<div class="resource-notes">${esc(resource.notes)}</div>` : ''}
      <a class="open-btn" href="${esc(resource.url)}" target="_blank" rel="noopener">Open Resource <span class="arrow">→</span></a>
      <div class="resource-meta">
        <span><span class="meta-mark">⌛</span> Created: ${resource.createdAt}</span>
        <span><span class="meta-mark">⌛</span> Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  } else {
    card.innerHTML = `
      <span class="resource-type-badge type-note">⟐ NOTE</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <div class="resource-content">${esc(resource.content)}</div>
      <div class="resource-meta">
        <span><span class="meta-mark">⌛</span> Created: ${resource.createdAt}</span>
        <span><span class="meta-mark">⌛</span> Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  }
}

// ===== SHOW ADMIN =====
function showAdmin() {
  currentView = 'admin';
  const av = document.getElementById('adminViewer');
  av.classList.add('active');
  hideAllViews(); // hides landing immediately; fades out previous viewer if any
  _showViewer(av);
  renderAdmin();
}

function renderAdmin() {
  const resources = db.resources;
  const links = resources.filter(r => r.type === 'link');
  const notes = resources.filter(r => r.type === 'note');
  const dates = resources.map(r => r.createdAt).sort();
  const newest = dates[dates.length - 1] || '—';
  const oldest = dates[0] || '—';

  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${resources.length}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num">${links.length}</div><div class="stat-label">Links</div></div>
    <div class="stat-card"><div class="stat-num">${notes.length}</div><div class="stat-label">Notes</div></div>
    <div class="stat-card"><div class="stat-num" style="font-size:0.8rem">${newest}</div><div class="stat-label">Newest</div></div>
  `;

  document.getElementById('resourceList').innerHTML = resources.map(r => `
    <div class="admin-item">
      <span class="admin-item-code">${esc(r.code)}</span>
      <span class="admin-item-title">${esc(r.title)}</span>
      <span class="admin-item-type ${r.type === 'link' ? 'type-link' : 'type-note'}">${r.type.toUpperCase()}</span>
      <div class="admin-item-actions">
        <button class="icon-btn" onclick="copyCode('${esc(r.code)}')" title="Copy code">📋</button>
        <button class="icon-btn" onclick="openEditModal('${r.code}')" title="Edit">✏️</button>
        <button class="icon-btn danger" onclick="deleteResource('${r.code}')" title="Delete">🗑️</button>
      </div>
    </div>
  `).join('');
}

// ===== ADMIN: ADD =====
function openAddModal(type) {
  const now = new Date().toISOString().split('T')[0];
  const code = generateCode(type);

  document.getElementById('modalContent').innerHTML = `
    <h3>New ${type === 'link' ? 'Link' : 'Note'}</h3>
    <div class="form-group">
      <label>Resource Code</label>
      <input id="formCode" value="${code}" readonly style="opacity:0.6">
    </div>
    <div class="form-group">
      <label>Title</label>
      <input id="formTitle" placeholder="Enter title">
    </div>
    ${type === 'link' ? `
    <div class="form-group">
      <label>URL</label>
      <input id="formUrl" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="formDesc" placeholder="Brief description"></textarea>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="formNotes" placeholder="Personal notes"></textarea>
    </div>
    ` : `
    <div class="form-group">
      <label>Content</label>
      <textarea id="formContent" placeholder="Write your note here..." style="min-height:200px"></textarea>
    </div>
    `}
    <div class="modal-actions">
      <button class="btn" onclick="saveNew('${type}')">Save</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveNew(type) {
  const code = document.getElementById('formCode').value.trim();
  const title = document.getElementById('formTitle').value.trim();
  if (!title) return toast('Title is required');

  // Check duplicate code
  if (db.resources.find(r => r.code === code)) {
    toast('Code collision. Generating new code...');
    // Regenerate
    document.getElementById('formCode').value = generateCode(type);
    return;
  }

  const now = new Date().toISOString().split('T')[0];
  const base = { code, title, createdAt: now, modifiedAt: now };

  if (type === 'link') {
    const url = document.getElementById('formUrl').value.trim();
    if (!url) return toast('URL is required');
    base.url = url.startsWith('http') ? url : 'https://' + url;
    base.description = document.getElementById('formDesc').value.trim();
    base.notes = document.getElementById('formNotes').value.trim();
  } else {
    base.content = document.getElementById('formContent').value.trim();
  }

  base.type = type;
  db.resources.push(base);
  closeModal();
  renderAdmin();
  toast(`${type === 'link' ? 'Link' : 'Note'} added successfully`);
}

// ===== ADMIN: EDIT =====
function openEditModal(code) {
  const r = db.resources.find(r => r.code === code);
  if (!r) return;

  document.getElementById('modalContent').innerHTML = `
    <h3>Edit Resource</h3>
    <div class="form-group">
      <label>Resource Code</label>
      <input id="formCode" value="${esc(r.code)}" readonly style="opacity:0.6">
    </div>
    <div class="form-group">
      <label>Title</label>
      <input id="formTitle" value="${esc(r.title)}">
    </div>
    ${r.type === 'link' ? `
    <div class="form-group">
      <label>URL</label>
      <input id="formUrl" value="${esc(r.url || '')}">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="formDesc">${esc(r.description || '')}</textarea>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="formNotes">${esc(r.notes || '')}</textarea>
    </div>
    ` : `
    <div class="form-group">
      <label>Content</label>
      <textarea id="formContent" style="min-height:200px">${esc(r.content || '')}</textarea>
    </div>
    `}
    <div class="modal-actions">
      <button class="btn" onclick="saveEdit('${r.code}')">Update</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveEdit(code) {
  const r = db.resources.find(r => r.code === code);
  if (!r) return;

  const title = document.getElementById('formTitle').value.trim();
  if (!title) return toast('Title is required');

  r.title = title;
  r.modifiedAt = new Date().toISOString().split('T')[0];

  if (r.type === 'link') {
    const url = document.getElementById('formUrl').value.trim();
    if (!url) return toast('URL is required');
    r.url = url.startsWith('http') ? url : 'https://' + url;
    r.description = document.getElementById('formDesc').value.trim();
    r.notes = document.getElementById('formNotes').value.trim();
  } else {
    r.content = document.getElementById('formContent').value.trim();
  }

  closeModal();
  renderAdmin();
  toast('Resource updated');
}

// ===== ADMIN: DELETE =====
function deleteResource(code) {
  if (!confirm(`Delete resource ${code}?`)) return;
  db.resources = db.resources.filter(r => r.code !== code);
  renderAdmin();
  toast('Resource deleted');
}

// ===== ADMIN: EXPORT =====
function exportDB() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'db.json';
  a.click();
  toast('Database exported');
}

// ===== ADMIN: IMPORT =====
function importDB(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.masterCode && Array.isArray(data.resources)) {
        db = data;
        renderAdmin();
        toast('Database imported successfully');
      } else {
        toast('Invalid database file');
      }
    } catch(err) {
      toast('Error parsing file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== ADMIN: CLEAR ALL =====
function clearAll() {
  db.resources = [];
  renderAdmin();
  toast('All resources cleared');
}

// ===== NAVIGATION =====
function goBack() {
  // Clear hash
  if (window.location.hash) {
    history.pushState('', document.title, window.location.pathname);
  }
  // hideAllViews fades out the current viewer (and immediately hides the landing
  // page so it can be re-shown cleanly). Then we show the landing page with a
  // scale+fade entrance.
  hideAllViews();
  const lp = document.getElementById('landingPage');
  lp.style.display = 'flex';
  // Re-trigger the landing entrance animation (it only runs on first render).
  lp.style.animation = 'none';
  void lp.offsetWidth;
  lp.style.animation = '';
  currentView = 'landing';
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
}

function hideAllViews() {
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('resourceViewer').classList.remove('active');
  document.getElementById('adminViewer').classList.remove('active');
}

// ===== CODE GENERATION =====
function generateCode(type) {
  const prefixes = { link: 'REF', note: 'ARC', default: 'IDX' };
  const prefix = prefixes[type] || prefixes.default;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let p1 = '', p2 = '';
  for (let i = 0; i < 4; i++) {
    p1 += chars[Math.floor(Math.random() * chars.length)];
    p2 += chars[Math.floor(Math.random() * chars.length)];
  }
  const code = `${prefix}-${p1}-${p2}`;

  // Check uniqueness
  if (db.resources.find(r => r.code === code)) return generateCode(type);
  return code;
}

// ===== COPY =====
function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('Code copied: ' + code));
}

// ===== MODAL =====
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ===== TOAST =====
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== UTILITY =====
function esc(s) {
  if (typeof s !== 'string') return s || '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && currentView === 'landing') {
    submitCode();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    } else if (currentView !== 'landing') {
      goBack();
    }
  }
});

// ===== QR CODES =====

function getResourceBaseUrl() {
  const loc = window.location;
  // Use origin+pathname so the QR encodes a shareable URL.
  // Guard against file:// and empty origins (local file open).
  if (!loc.origin || loc.origin === 'null' || loc.protocol === 'file:') {
    return null;
  }
  return loc.origin + loc.pathname;
}

function resourceShareUrl(resource, overrideBase) {
  const base = overrideBase || getResourceBaseUrl();
  if (!base) return null;
  return base + '#' + resource.code;
}

function renderQR(elementId, url, size) {
  const container = document.getElementById(elementId);
  if (!container) return;
  // Clear previous
  container.innerHTML = '';
  if (!url) {
    container.innerHTML = '<div class="no-qr-hint">Set a base URL above to generate the QR.</div>';
    return;
  }
  try {
    new QRCode(container, {
      text: url,
      width: size || 200,
      height: size || 200,
      colorDark: '#c9a84c',
      colorLight: '#0a0a1a',
      correctLevel: QRCode.CorrectLevel.H
    });
  } catch(e) {
    container.innerHTML = '<div class="no-qr-hint">QR library unavailable.</div>';
  }
}

function showResourceQR(resource, overrideBase) {
  const url = resourceShareUrl(resource, overrideBase);
  const container = document.getElementById('qrContainer');
  const hint = document.getElementById('qrHint');
  container.innerHTML = '';
  if (!url) {
    container.innerHTML = '';
    hint.textContent = 'This page is open from a local file. Deploy the site (e.g. GitHub Pages) and reopen to generate QR codes that link back to it. Alternatively, enter your deployed URL in the admin QR Codes view.';
    return;
  }
  hint.textContent = '';
  renderQR('qrContainer', url, 200);
}

function resourceStoredUrl(resource) {
  // Allow per-resource custom URL stored on the resource (e.g. your deployed domain).
  return (resource.qrUrl && resource.qrUrl.trim()) || null;
}

function renderQRTab() {
  const grid = document.getElementById('qrGrid');
  grid.style.display = 'grid';
  grid.innerHTML = db.resources.map(r => {
    const url = resourceStoredUrl(r) || resourceShareUrl(r);
    return `
      <div class="qr-wrap">
        <div id="qr-${esc(r.code)}"></div>
        <div class="qr-label"><span class="qr-code-tag">${esc(r.code)}</span>${esc(r.title)}</div>
        <input class="qr-url-editable" id="qrurl-${esc(r.code)}"
          value="${esc(url || '')}"
          placeholder="deployed URL#${esc(r.code)}"
          onchange="updateResourceQRUrl('${esc(r.code)}', this.value)"
        >
      </div>
    `;
  }).join('');

  // Render each QR after DOM insertion
  db.resources.forEach(r => {
    const url = resourceStoredUrl(r) || resourceShareUrl(r);
    renderQR('qr-' + esc(r.code), url, 180);
  });

  toast('QR codes ready — right-click any to save, or paste this page into your notes.');
}

function updateResourceQRUrl(code, val) {
  const r = db.resources.find(x => x.code === code);
  if (!r) return;
  r.qrUrl = val.trim() || null;
  // Re-render this QR
  const url = resourceStoredUrl(r) || resourceShareUrl(r);
  renderQR('qr-' + code, url, 180);
  // Also refresh the viewer-side QR if currently viewing this resource
  if (currentResource && currentResource.code === code) {
    showResourceQR(r);
  }
  saveDBLocal();
}

function saveDBLocal() {
  // Persist in-memory changes to db.json via a blob download prompt,
  // since we cannot write to the static file from the browser.
  // The admin can use Export to get the updated file.
  try {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'db.json';
    a.click();
  } catch(e) { /* ignore */ }
}

// ===== QR TAB SWITCHING (resource viewer) =====
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.qr-tab');
  if (!tab) return;
  const panelId = tab.getAttribute('data-qr-panel');
  document.querySelectorAll('.qr-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.qr-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('qrPanel' + (panelId === 'details' ? 'Details' : 'Qr'));
  if (panel) panel.classList.add('active');
  if (panelId === 'qr') {
    if (currentResource) showResourceQR(currentResource);
  }
});

// ===== UPDATE showResource to fill the details + QR panels =====
const _origShowResource = showResource;
showResource = function(resource) {
  currentView = 'resource';
  currentResource = resource;
  document.getElementById('viewerCode').textContent = resource.code;

  // Reset QR tabs to Details
  document.querySelectorAll('.qr-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.qr-tab[data-qr-panel="details"]').classList.add('active');
  document.querySelectorAll('.qr-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('qrPanelDetails').classList.add('active');

  const card = document.getElementById('resourceCard');

  if (resource.type === 'link') {
    card.innerHTML = `
      <span class="resource-type-badge type-link">⟐ LINK</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <div class="resource-source-label">Source</div>
      <a class="resource-url" href="${esc(resource.url)}" target="_blank" rel="noopener">${esc(resource.url)}</a>
      ${resource.description ? `<div class="resource-desc">${esc(resource.description)}</div>` : ''}
      ${resource.notes ? `<div class="resource-notes">${esc(resource.notes)}</div>` : ''}
      <a class="open-btn" href="${esc(resource.url)}" target="_blank" rel="noopener">Open Resource <span class="arrow">→</span></a>
      <div class="resource-meta">
        <span><span class="meta-mark">⌛</span> Created: ${resource.createdAt}</span>
        <span><span class="meta-mark">⌛</span> Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  } else {
    card.innerHTML = `
      <span class="resource-type-badge type-note">⟐ NOTE</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <div class="resource-content">${esc(resource.content)}</div>
      <div class="resource-meta">
        <span><span class="meta-mark">⌛</span> Created: ${resource.createdAt}</span>
        <span><span class="meta-mark">⌛</span> Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  }

  // Populate details panel (reuses card content)
  document.getElementById('qrPanelDetails').innerHTML = card.innerHTML;

  // Pre-render QR using stored URL if available
  if (resource.qrUrl) {
    showResourceQR(resource, resource.qrUrl);
  } else {
    showResourceQR(resource);
  }

  // Now show the viewer (hides landing + any stale fade-out timer, then fades in).
  const viewer = document.getElementById('resourceViewer');
  viewer.classList.add('active');
  hideAllViews(); // hides landing immediately; fades out previous viewer if any
  _showViewer(viewer);
};

// ===== AMBIENT PARTICLES =====
(function() {
  const canvas = document.getElementById('particles');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  let particles = [];
  let w, h, dpr;

  function size() {
    const ctx2 = canvas.getContext('2d');
    if (!ctx2) return false;
    ctx = ctx2;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return true;
  }

  const COUNT = 70;
  function init() {
    particles = [];
    for (let i = 0; i < COUNT; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.6 + 0.4,
        dx: (Math.random() - 0.5) * 0.25,
        dy: (Math.random() - 0.5) * 0.25,
        alpha: Math.random() * 0.5 + 0.15,
        gold: Math.random() < 0.22
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      p.x += p.dx;
      p.y += p.dy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      const color = p.gold ? '201,168,76' : '180,190,210';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${color},${p.alpha})`;
      ctx.fill();

      // faint glow for gold ones
      if (p.gold) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(201,168,76,${p.alpha * 0.12})`;
        ctx.fill();
      }
    }
    // draw faint connections between nearby particles
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const a = particles[i], b = particles[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 110) {
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(201,168,76,${0.05 * (1 - dist/110)})`;
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
  }

  let rafId = null;
  function loop() {
    draw();
    rafId = requestAnimationFrame(loop);
  }  if (size()) { init(); loop(); }

  window.addEventListener('resize', () => {
    if (size()) { init(); }
  });
})();


// ===== FILM GRAIN =====
(function() {
  const canvas = document.getElementById('grain');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  function size() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
  }
  if (size()) {
  function draw() {
    const imageData = ctx.createImageData(w * dpr, h * dpr);
    const data = imageData.data;
    for (let i = 0; i < data.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      data[i] = v; data[i+1] = v; data[i+2] = v; data[i+3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }
    draw();
    window.addEventListener('resize', size);
  }
})();

// ===== VIEW TRANSITIONS =====
// Show/hide the resource & admin viewers.
//
// CORRECTNESS FIX: the previous code scheduled a setTimeout in hideAllViews() to
// hide the viewer ~250ms after it ran. But showResource/showAdmin call hideAllViews()
// and then immediately show the viewer again, so the viewer was hidden shortly after
// fading in — making every article appear and then disappear. The user could not access
// any article.
//
// Fix: hideAllViews() now hides immediately (no setTimeout). The only animation is a
// fade-IN when a viewer is shown. This guarantees the viewer stays visible after it is
// shown. We also hide the landing page immediately (not via timer) when entering a
// viewer, and re-trigger the landing entrance animation when going back.
var _viewRaf = 0;

function _cancelViewRaf() {
  if (_viewRaf) { cancelAnimationFrame(_viewRaf); _viewRaf = 0; }
}

function _hideViewer(el) {
  if (!el) return;
  el.classList.remove('active');
  el.style.display = 'none';
  el.style.opacity = '';
  el.style.transform = '';
  el.style.transition = '';
}

hideAllViews = function() {
  _cancelViewRaf();
  var rl = document.getElementById('resourceViewer');
  var al = document.getElementById('adminViewer');
  var lp = document.getElementById('landingPage');
  // Hide the landing page immediately when we move to a viewer (it is the fallback
  // screen). This is instant — no timer — so the landing never lingers or reappears.
  if (lp) lp.style.display = 'none';
  _hideViewer(rl);
  _hideViewer(al);
};

function _fadeIn(el) {
  if (!el) return;
  el.classList.add('active');
  el.style.display = 'block';
  // Force reflow so opacity-0 + transform take effect before the transition starts.
  void el.offsetWidth;
  el.style.transition = 'none';
  el.style.opacity = '0';
  el.style.transform = 'translateY(10px)';
  _viewRaf = requestAnimationFrame(function() {
    el.style.transition = 'opacity 0.45s ease, transform 0.45s ease';
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
    _viewRaf = 0;
  });
}

function _showViewer(viewer) {
  _cancelViewRaf();
  _fadeIn(viewer);
}

init();
</script>
