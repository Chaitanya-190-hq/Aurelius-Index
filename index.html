<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurelius Index</title>
<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0f;
  color: #e0e0e0;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== ANIMATED GRADIENT BACKGROUND ===== */
.bg {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: -1;
  background: linear-gradient(135deg, #0a0a1a, #1a0a2e, #0a1a2e, #0a0a1a);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a2e; }
::-webkit-scrollbar-thumb { background: #c9a84c; border-radius: 3px; }

/* ===== GLASSMORPHISM CARD ===== */
.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px;
  max-width: 480px;
  width: 90%;
  margin: 0 auto;
}

/* ===== CENTER CONTAINER ===== */
.center-screen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 20px;
}

/* ===== LANDING PAGE ===== */
.landing-title {
  font-size: 2.2rem; font-weight: 300; letter-spacing: 4px;
  text-align: center; color: #c9a84c; margin-bottom: 8px;
}
.landing-sub {
  text-align: center; color: #888; font-size: 0.85rem;
  letter-spacing: 2px; margin-bottom: 30px;
}
.code-input {
  width: 100%; padding: 14px 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; color: #fff; font-size: 1rem;
  letter-spacing: 3px; text-align: center;
  outline: none; transition: border 0.3s;
  text-transform: uppercase;
}
.code-input:focus { border-color: #c9a84c; }
.code-input::placeholder { letter-spacing: 1px; text-transform: none; color: #555; }
.btn {
  width: 100%; padding: 14px; margin-top: 14px;
  background: linear-gradient(135deg, #c9a84c, #b8922e);
  border: none; border-radius: 12px; color: #0a0a0f;
  font-size: 1rem; font-weight: 600; letter-spacing: 2px;
  cursor: pointer; transition: transform 0.2s, opacity 0.2s;
}
.btn:hover { transform: translateY(-1px); opacity: 0.92; }
.btn:active { transform: translateY(0); }
.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: #c9a84c; border: 1px solid rgba(201,168,76,0.3);
  margin-top: 8px;
}
.error-msg {
  color: #ff6b6b; font-size: 0.85rem; text-align: center;
  margin-top: 12px; min-height: 20px;
}

/* ===== VALIDATION OVERLAY ===== */
.validation-overlay {
  display: none; position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; z-index: 100;
  background: rgba(10,10,15,0.92);
  align-items: center; justify-content: center; flex-direction: column;
}
.validation-overlay.active { display: flex; }
.spinner {
  width: 50px; height: 50px;
  border: 3px solid rgba(201,168,76,0.15);
  border-top: 3px solid #c9a84c;
  border-radius: 50%; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.val-text {
  margin-top: 20px; font-size: 1.1rem; letter-spacing: 2px;
  color: #c9a84c; animation: pulse 1.5s ease infinite;
}
.val-sub {
  margin-top: 8px; font-size: 0.85rem; color: #666;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}
.val-steps { margin-top: 24px; }
.val-step {
  color: #555; font-size: 0.8rem; letter-spacing: 1px;
  margin: 6px 0; transition: color 0.5s;
}
.val-step.done { color: #4caf50; }
.val-step.active { color: #c9a84c; }

/* ===== RESOURCE VIEWER ===== */
.resource-viewer {
  display: none; max-width: 700px; width: 90%; margin: 40px auto;
}
.resource-viewer.active { display: block; }
.back-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px;
}
.back-btn {
  background: none; border: none; color: #c9a84c; cursor: pointer;
  font-size: 0.9rem; letter-spacing: 1px; padding: 8px 0;
}
.back-btn:hover { opacity: 0.8; }
.code-badge {
  font-size: 0.75rem; color: #888; letter-spacing: 2px;
  padding: 4px 12px; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
}
.resource-card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; padding: 36px;
}
.resource-type-badge {
  display: inline-block; font-size: 0.7rem; letter-spacing: 2px;
  padding: 4px 12px; border-radius: 20px; margin-bottom: 16px;
}
.type-link { background: rgba(76,175,80,0.15); color: #4caf50; }
.type-note { background: rgba(33,150,243,0.15); color: #2196f3; }
.resource-title { font-size: 1.8rem; font-weight: 300; margin-bottom: 8px; }
.resource-url {
  display: block; color: #c9a84c; font-size: 0.85rem;
  margin-bottom: 16px; word-break: break-all;
}
.resource-desc { color: #aaa; line-height: 1.6; margin-bottom: 16px; }
.resource-notes {
  background: rgba(255,255,255,0.03); padding: 16px;
  border-radius: 12px; font-size: 0.9rem; line-height: 1.6;
  color: #bbb; white-space: pre-wrap;
}
.resource-content {
  line-height: 1.8; font-size: 1rem; color: #ccc;
  white-space: pre-wrap;
}
.resource-meta {
  margin-top: 20px; font-size: 0.75rem; color: #555;
  display: flex; gap: 20px;
}
.open-btn {
  display: inline-block; padding: 12px 28px; margin-top: 16px;
  background: linear-gradient(135deg, #c9a84c, #b8922e);
  border: none; border-radius: 12px; color: #0a0a0f;
  font-size: 0.95rem; font-weight: 600; letter-spacing: 1px;
  text-decoration: none; cursor: pointer; transition: transform 0.2s;
}
.open-btn:hover { transform: translateY(-2px); }

/* ===== ADMIN DASHBOARD ===== */
.admin-viewer {
  display: none; max-width: 900px; width: 95%; margin: 40px auto;
}
.admin-viewer.active { display: block; }
.admin-header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; margin-bottom: 24px;
}
.admin-title { font-size: 1.8rem; font-weight: 300; color: #c9a84c; }
.admin-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
  gap: 12px; margin-bottom: 24px;
}
.stat-card {
  background: rgba(255,255,255,0.04); padding: 16px; border-radius: 12px;
  text-align: center; border: 1px solid rgba(255,255,255,0.06);
}
.stat-num { font-size: 1.8rem; font-weight: 300; color: #c9a84c; }
.stat-label { font-size: 0.75rem; color: #666; letter-spacing: 1px; margin-top: 4px; }

.admin-actions {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;
}
.btn-sm {
  padding: 8px 16px; font-size: 0.8rem; border-radius: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: #e0e0e0; cursor: pointer; transition: all 0.2s;
  letter-spacing: 1px;
}
.btn-sm:hover { border-color: #c9a84c; color: #c9a84c; }
.btn-sm.danger { border-color: rgba(255,107,107,0.3); color: #ff6b6b; }
.btn-sm.danger:hover { border-color: #ff6b6b; }
.btn-sm.primary { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.3); color: #c9a84c; }
.btn-sm.primary:hover { background: rgba(201,168,76,0.2); }

/* ===== RESOURCE LIST (ADMIN) ===== */
.resource-list { margin-top: 16px; }
.admin-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; background: rgba(255,255,255,0.03);
  border-radius: 12px; margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.05);
  transition: border 0.2s;
}
.admin-item:hover { border-color: rgba(255,255,255,0.12); }
.admin-item-code { font-size: 0.7rem; color: #666; letter-spacing: 1px; width: 130px; }
.admin-item-title { flex: 1; margin: 0 12px; font-size: 0.9rem; }
.admin-item-type { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; }
.admin-item-actions { display: flex; gap: 4px; }
.icon-btn {
  background: none; border: none; color: #888; cursor: pointer;
  padding: 6px; font-size: 0.9rem; border-radius: 6px; transition: all 0.2s;
}
.icon-btn:hover { color: #c9a84c; background: rgba(255,255,255,0.05); }
.icon-btn.danger:hover { color: #ff6b6b; }

/* ===== MODAL ===== */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10,10,15,0.85); z-index: 50;
  align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #1a1a2e; border-radius: 16px; padding: 32px;
  max-width: 520px; width: 100%; border: 1px solid rgba(255,255,255,0.08);
  max-height: 90vh; overflow-y: auto;
}
.modal h3 { font-size: 1.3rem; font-weight: 300; margin-bottom: 20px; color: #c9a84c; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 4px; letter-spacing: 1px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; color: #fff; font-size: 0.9rem;
  outline: none; transition: border 0.3s;
}
.form-group textarea { min-height: 100px; resize: vertical; }
.form-group input:focus, .form-group textarea:focus { border-color: #c9a84c; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }

/* ===== TOAST ===== */
.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1);
  color: #e0e0e0; padding: 12px 24px; border-radius: 12px;
  font-size: 0.85rem; z-index: 200;
  opacity: 0; transition: opacity 0.4s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .glass { padding: 24px; }
  .landing-title { font-size: 1.6rem; }
  .resource-card { padding: 24px; }
  .resource-title { font-size: 1.3rem; }
  .admin-header { flex-direction: column; align-items: flex-start; }
  .admin-item { flex-wrap: wrap; gap: 8px; }
  .admin-item-code { width: auto; }
  .modal { padding: 20px; }
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- ===== VALIDATION OVERLAY ===== -->
<div class="validation-overlay" id="validationOverlay">
  <div class="spinner"></div>
  <div class="val-text" id="valText">Validating Access...</div>
  <div class="val-sub" id="valSub">Secure handshake in progress</div>
  <div class="val-steps" id="valSteps">
    <div class="val-step" data-step="0">⟐ Validating credentials</div>
    <div class="val-step" data-step="1">⟐ Decrypting resource</div>
    <div class="val-step" data-step="2">⟐ Loading content</div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- ===== LANDING PAGE ===== -->
<div class="center-screen" id="landingPage">
  <div class="glass">
    <div class="landing-title">Aurelius Index</div>
    <div class="landing-sub">PRIVATE REFERENCE SYSTEM</div>
    <input class="code-input" id="codeInput" placeholder="Enter Resource Code" maxlength="20" spellcheck="false">
    <button class="btn" onclick="submitCode()">ACCESS</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<!-- ===== RESOURCE VIEWER ===== -->
<div class="resource-viewer" id="resourceViewer">
  <div class="back-bar">
    <button class="back-btn" onclick="goBack()">← BACK</button>
    <span class="code-badge" id="viewerCode"></span>
  </div>
  <div class="resource-card" id="resourceCard"></div>
</div>

<!-- ===== ADMIN VIEWER ===== -->
<div class="admin-viewer" id="adminViewer">
  <div class="admin-header">
    <div class="admin-title">⚙ Aurelius Admin</div>
    <button class="back-btn" onclick="goBack()">← EXIT ADMIN</button>
  </div>

  <div class="admin-stats" id="adminStats"></div>

  <div class="admin-actions">
    <button class="btn-sm primary" onclick="openAddModal('link')">+ New Link</button>
    <button class="btn-sm primary" onclick="openAddModal('note')">+ New Note</button>
    <button class="btn-sm" onclick="exportDB()">⬇ Export</button>
    <button class="btn-sm" onclick="document.getElementById('importInput').click()">⬆ Import</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importDB(event)">
    <button class="btn-sm danger" onclick="if(confirm('Remove ALL data?')){clearAll()}">✕ Clear All</button>
  </div>

  <div class="resource-list" id="resourceList"></div>
</div>

<script>
// ===== DATA =====
let db = { masterCode: '', resources: [] };
let currentView = 'landing'; // landing | resource | admin
let currentResource = null;

// ===== INIT =====
async function init() {
  try {
    const res = await fetch('db.json?' + Date.now());
    db = await res.json();
  } catch(e) {
    // Seed with defaults if db.json not found
    db = {
      "masterCode": "AUR-MSTR-KEY-001",
      "resources": [
        {
          "code": "REF-7X9Q-K2M4",
          "type": "link",
          "title": "Python Documentation",
          "url": "https://docs.python.org",
          "description": "Official Python documentation, tutorials, and guides.",
          "notes": "Great reference for standard library.",
          "createdAt": new Date().toISOString().split('T')[0],
          "modifiedAt": new Date().toISOString().split('T')[0]
        },
        {
          "code": "ARC-3M8P-W5L2",
          "type": "note",
          "title": "Welcome to Aurelius Index",
          "content": "This is a private reference system.\n\nEnter a resource code to view content.\nEnter the master code to access admin.",
          "createdAt": new Date().toISOString().split('T')[0],
          "modifiedAt": new Date().toISOString().split('T')[0]
        }
      ]
    };
  }

  // Check URL hash for direct access
  const hash = window.location.hash.replace('#', '').trim();
  if (hash) {
    document.getElementById('codeInput').value = hash;
    submitCode();
  }
}

// ===== CODE SUBMISSION =====
function submitCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  document.getElementById('errorMsg').textContent = '';

  if (!code) {
    document.getElementById('errorMsg').textContent = 'Enter a resource or master code.';
    return;
  }

  // Check master code
  if (code === db.masterCode) {
    showValidation(true);
    setTimeout(() => {
      hideValidation();
      showAdmin();
    }, 2000);
    return;
  }

  // Check resource code
  const resource = db.resources.find(r => r.code === code);
  if (resource) {
    showValidation(false);
    setTimeout(() => {
      hideValidation();
      showResource(resource);
    }, 2000);
    return;
  }

  document.getElementById('errorMsg').textContent = 'Invalid code. No resource found.';
}

// ===== VALIDATION ANIMATION =====
function showValidation(isMaster) {
  const overlay = document.getElementById('validationOverlay');
  const text = document.getElementById('valText');
  const sub = document.getElementById('valSub');
  const steps = document.querySelectorAll('.val-step');

  overlay.classList.add('active');
  steps.forEach(s => s.className = 'val-step');

  if (isMaster) {
    text.textContent = 'Authenticating Administrator...';
    sub.textContent = 'Master clearance verification';
  } else {
    text.textContent = 'Validating Access...';
    sub.textContent = 'Secure handshake in progress';
  }

  // Animate steps
  setTimeout(() => { steps[0].classList.add('active'); }, 300);
  setTimeout(() => { steps[0].classList.remove('active'); steps[0].classList.add('done'); steps[1].classList.add('active'); }, 900);
  setTimeout(() => { steps[1].classList.remove('active'); steps[1].classList.add('done'); steps[2].classList.add('active'); }, 1500);
  setTimeout(() => { steps[2].classList.remove('active'); steps[2].classList.add('done'); }, 2000);
}

function hideValidation() {
  document.getElementById('validationOverlay').classList.remove('active');
}

// ===== SHOW RESOURCE =====
function showResource(resource) {
  currentView = 'resource';
  currentResource = resource;
  hideAllViews();
  document.getElementById('resourceViewer').classList.add('active');
  document.getElementById('viewerCode').textContent = resource.code;

  const card = document.getElementById('resourceCard');

  if (resource.type === 'link') {
    card.innerHTML = `
      <span class="resource-type-badge type-link">⟐ LINK</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <a class="resource-url" href="${esc(resource.url)}" target="_blank">${esc(resource.url)}</a>
      ${resource.description ? `<div class="resource-desc">${esc(resource.description)}</div>` : ''}
      ${resource.notes ? `<div class="resource-notes">${esc(resource.notes)}</div>` : ''}
      <a class="open-btn" href="${esc(resource.url)}" target="_blank">Open Resource</a>
      <div class="resource-meta">
        <span>Created: ${resource.createdAt}</span>
        <span>Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  } else {
    card.innerHTML = `
      <span class="resource-type-badge type-note">⟐ NOTE</span>
      <div class="resource-title">${esc(resource.title)}</div>
      <div class="resource-content">${esc(resource.content)}</div>
      <div class="resource-meta">
        <span>Created: ${resource.createdAt}</span>
        <span>Modified: ${resource.modifiedAt}</span>
      </div>
    `;
  }
}

// ===== SHOW ADMIN =====
function showAdmin() {
  currentView = 'admin';
  hideAllViews();
  document.getElementById('adminViewer').classList.add('active');
  renderAdmin();
}

function renderAdmin() {
  const resources = db.resources;
  const links = resources.filter(r => r.type === 'link');
  const notes = resources.filter(r => r.type === 'note');
  const dates = resources.map(r => r.createdAt).sort();
  const newest = dates[dates.length - 1] || '—';
  const oldest = dates[0] || '—';

  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${resources.length}</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num">${links.length}</div><div class="stat-label">Links</div></div>
    <div class="stat-card"><div class="stat-num">${notes.length}</div><div class="stat-label">Notes</div></div>
    <div class="stat-card"><div class="stat-num" style="font-size:0.8rem">${newest}</div><div class="stat-label">Newest</div></div>
  `;

  document.getElementById('resourceList').innerHTML = resources.map(r => `
    <div class="admin-item">
      <span class="admin-item-code">${esc(r.code)}</span>
      <span class="admin-item-title">${esc(r.title)}</span>
      <span class="admin-item-type ${r.type === 'link' ? 'type-link' : 'type-note'}">${r.type.toUpperCase()}</span>
      <div class="admin-item-actions">
        <button class="icon-btn" onclick="copyCode('${esc(r.code)}')" title="Copy code">📋</button>
        <button class="icon-btn" onclick="openEditModal('${r.code}')" title="Edit">✏️</button>
        <button class="icon-btn danger" onclick="deleteResource('${r.code}')" title="Delete">🗑️</button>
      </div>
    </div>
  `).join('');
}

// ===== ADMIN: ADD =====
function openAddModal(type) {
  const now = new Date().toISOString().split('T')[0];
  const code = generateCode(type);

  document.getElementById('modalContent').innerHTML = `
    <h3>New ${type === 'link' ? 'Link' : 'Note'}</h3>
    <div class="form-group">
      <label>Resource Code</label>
      <input id="formCode" value="${code}" readonly style="opacity:0.6">
    </div>
    <div class="form-group">
      <label>Title</label>
      <input id="formTitle" placeholder="Enter title">
    </div>
    ${type === 'link' ? `
    <div class="form-group">
      <label>URL</label>
      <input id="formUrl" placeholder="https://...">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="formDesc" placeholder="Brief description"></textarea>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="formNotes" placeholder="Personal notes"></textarea>
    </div>
    ` : `
    <div class="form-group">
      <label>Content</label>
      <textarea id="formContent" placeholder="Write your note here..." style="min-height:200px"></textarea>
    </div>
    `}
    <div class="modal-actions">
      <button class="btn" onclick="saveNew('${type}')">Save</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveNew(type) {
  const code = document.getElementById('formCode').value.trim();
  const title = document.getElementById('formTitle').value.trim();
  if (!title) return toast('Title is required');

  // Check duplicate code
  if (db.resources.find(r => r.code === code)) {
    toast('Code collision. Generating new code...');
    // Regenerate
    document.getElementById('formCode').value = generateCode(type);
    return;
  }

  const now = new Date().toISOString().split('T')[0];
  const base = { code, title, createdAt: now, modifiedAt: now };

  if (type === 'link') {
    const url = document.getElementById('formUrl').value.trim();
    if (!url) return toast('URL is required');
    base.url = url.startsWith('http') ? url : 'https://' + url;
    base.description = document.getElementById('formDesc').value.trim();
    base.notes = document.getElementById('formNotes').value.trim();
  } else {
    base.content = document.getElementById('formContent').value.trim();
  }

  base.type = type;
  db.resources.push(base);
  closeModal();
  renderAdmin();
  toast(`${type === 'link' ? 'Link' : 'Note'} added successfully`);
}

// ===== ADMIN: EDIT =====
function openEditModal(code) {
  const r = db.resources.find(r => r.code === code);
  if (!r) return;

  document.getElementById('modalContent').innerHTML = `
    <h3>Edit Resource</h3>
    <div class="form-group">
      <label>Resource Code</label>
      <input id="formCode" value="${esc(r.code)}" readonly style="opacity:0.6">
    </div>
    <div class="form-group">
      <label>Title</label>
      <input id="formTitle" value="${esc(r.title)}">
    </div>
    ${r.type === 'link' ? `
    <div class="form-group">
      <label>URL</label>
      <input id="formUrl" value="${esc(r.url || '')}">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="formDesc">${esc(r.description || '')}</textarea>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="formNotes">${esc(r.notes || '')}</textarea>
    </div>
    ` : `
    <div class="form-group">
      <label>Content</label>
      <textarea id="formContent" style="min-height:200px">${esc(r.content || '')}</textarea>
    </div>
    `}
    <div class="modal-actions">
      <button class="btn" onclick="saveEdit('${r.code}')">Update</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

function saveEdit(code) {
  const r = db.resources.find(r => r.code === code);
  if (!r) return;

  const title = document.getElementById('formTitle').value.trim();
  if (!title) return toast('Title is required');

  r.title = title;
  r.modifiedAt = new Date().toISOString().split('T')[0];

  if (r.type === 'link') {
    const url = document.getElementById('formUrl').value.trim();
    if (!url) return toast('URL is required');
    r.url = url.startsWith('http') ? url : 'https://' + url;
    r.description = document.getElementById('formDesc').value.trim();
    r.notes = document.getElementById('formNotes').value.trim();
  } else {
    r.content = document.getElementById('formContent').value.trim();
  }

  closeModal();
  renderAdmin();
  toast('Resource updated');
}

// ===== ADMIN: DELETE =====
function deleteResource(code) {
  if (!confirm(`Delete resource ${code}?`)) return;
  db.resources = db.resources.filter(r => r.code !== code);
  renderAdmin();
  toast('Resource deleted');
}

// ===== ADMIN: EXPORT =====
function exportDB() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'db.json';
  a.click();
  toast('Database exported');
}

// ===== ADMIN: IMPORT =====
function importDB(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.masterCode && Array.isArray(data.resources)) {
        db = data;
        renderAdmin();
        toast('Database imported successfully');
      } else {
        toast('Invalid database file');
      }
    } catch(err) {
      toast('Error parsing file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== ADMIN: CLEAR ALL =====
function clearAll() {
  db.resources = [];
  renderAdmin();
  toast('All resources cleared');
}

// ===== NAVIGATION =====
function goBack() {
  // Clear hash
  if (window.location.hash) {
    history.pushState('', document.title, window.location.pathname);
  }
  hideAllViews();
  document.getElementById('landingPage').style.display = 'flex';
  currentView = 'landing';
  document.getElementById('codeInput').value = '';
  document.getElementById('codeInput').focus();
}

function hideAllViews() {
  document.getElementById('landingPage').style.display = 'none';
  document.getElementById('resourceViewer').classList.remove('active');
  document.getElementById('adminViewer').classList.remove('active');
}

// ===== CODE GENERATION =====
function generateCode(type) {
  const prefixes = { link: 'REF', note: 'ARC', default: 'IDX' };
  const prefix = prefixes[type] || prefixes.default;
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let p1 = '', p2 = '';
  for (let i = 0; i < 4; i++) {
    p1 += chars[Math.floor(Math.random() * chars.length)];
    p2 += chars[Math.floor(Math.random() * chars.length)];
  }
  const code = `${prefix}-${p1}-${p2}`;

  // Check uniqueness
  if (db.resources.find(r => r.code === code)) return generateCode(type);
  return code;
}

// ===== COPY =====
function copyCode(code) {
  navigator.clipboard.writeText(code).then(() => toast('Code copied: ' + code));
}

// ===== MODAL =====
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

// ===== TOAST =====
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ===== UTILITY =====
function esc(s) {
  if (typeof s !== 'string') return s || '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ===== KEYBOARD =====
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && currentView === 'landing') {
    submitCode();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('active')) {
      closeModal();
    } else if (currentView !== 'landing') {
      goBack();
    }
  }
});

// ===== START =====
init();
</script>
</body>
</html>
